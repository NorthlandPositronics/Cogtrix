# Cogtrix + Waha (WhatsApp) Docker Compose
#
# Usage:
#   docker compose up -d              # start Waha + Cogtrix
#   open http://localhost:3000        # scan QR code with your phone
#   docker compose exec cogtrix python cogtrix.py   # start chatting
#
# To also run Ollama in Docker, uncomment the ollama service below.

services:
  # ── Waha: WhatsApp Web bridge ─────────────────────────────────
  waha:
    image: devlikeapro/waha
    container_name: waha
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - waha-data:/app/.sessions
    environment:
      # Uncomment to secure the Waha API with a key:
      # WHATSAPP_API_KEY: "yoursecretkey"
      WHATSAPP_DEFAULT_ENGINE: WEBJS

  # ── Cogtrix: AI assistant ─────────────────────────────────────
  cogtrix:
    build: .
    image: ghcr.io/northlandpositronics/cogtrix:latest
    container_name: cogtrix
    init: true
    stdin_open: true
    tty: true
    restart: "no"
    depends_on:
      - waha
    volumes:
      - cogtrix-data:/app/data
      # Or mount a local directory for easy access:
      # - $HOME/.config/cogtrix/data:/app/data
      # Mount your config file (optional):
      # - ./.cogtrix.json:/app/.cogtrix.json:ro
    environment:
      # -- WhatsApp (connects to the waha service above) --
      COGTRIX_WHATSAPP_URL: "http://waha:3000"
      # If you set WHATSAPP_API_KEY above, uncomment this:
      # COGTRIX_WHATSAPP_API_KEY: "yoursecretkey"

      # -- LLM providers --
      # Uncomment ONE provider (or set multiple and use --setup to choose):

      # Ollama (default: connects to host machine)
      # Linux users: use --network host or set the real IP
      COGTRIX_OLLAMA: "host.docker.internal"

      # OpenAI (set API key to enable; provider auto-detected)
      # OPENAI_API_KEY: "sk-..."

      # Anthropic Claude (set API key to enable; provider auto-detected)
      # ANTHROPIC_API_KEY: "sk-ant-..."

      # Google Gemini (set API key to enable; provider auto-detected)
      # GEMINI_API_KEY: "..."

      # xAI Grok (set API key to enable; provider auto-detected)
      # XAI_API_KEY: "xai-..."

      # -- Optional search API keys --
      # TAVILY_API_KEY: "tvly-..."
      # EXA_API_KEY: "exa-..."
      # BRAVE_API_KEY: "BSA..."
      # OPENWEATHER_API_KEY: "..."

      # -- Optional Telegram bot --
      # COGTRIX_TELEGRAM_TOKEN: "123456:ABC-DEF..."

  # ── Ollama (optional — uncomment to run Ollama in Docker) ─────
  # ollama:
  #   image: ollama/ollama
  #   container_name: ollama
  #   restart: unless-stopped
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama-data:/root/.ollama
  #   # Uncomment for GPU passthrough (NVIDIA):
  #   # deploy:
  #   #   resources:
  #   #     reservations:
  #   #       devices:
  #   #         - capabilities: [gpu]

volumes:
  waha-data:
  cogtrix-data:
  # ollama-data:

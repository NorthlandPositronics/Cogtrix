{{- if .Values.serviceAccount.rbac.enabled -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cogtrix.fullname" . }}
  labels:
    {{- include "cogtrix.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - configmaps
    resourceNames:
      - {{ include "cogtrix.fullname" . }}-config
    verbs:
      - get
  - apiGroups: [""]
    resources:
      - secrets
    resourceNames:
      - {{ include "cogtrix.fullname" . }}
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cogtrix.fullname" . }}
  labels:
    {{- include "cogtrix.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cogtrix.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cogtrix.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

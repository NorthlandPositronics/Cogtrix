apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "cogtrix.fullname" . }}-test-connection"
  labels:
    {{- include "cogtrix.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      # Reuse the digest-pinned init image (busybox) for supply-chain
      # consistency (#2062) instead of a mutable tag.
      image: {{ include "cogtrix.initImage" . }}
      command:
        - wget
        - -qO-
        - "http://{{ include "cogtrix.fullname" . }}:{{ .Values.service.port }}/api/v1/health"
  restartPolicy: Never

---
# docker-compose.yml
#
# Usage:
#   cp config/cogtrix.env.example config/cogtrix.env   # fill in secrets
#   cp config/cogtrix.yml.example config/cogtrix.yml   # adjust settings
#   docker compose up -d
#
# Required secrets in config/cogtrix.env:
#   COGTRIX_JWT_SECRET=<random 32+ char string>
#   OPENAI_API_KEY=sk-...   (or ANTHROPIC_API_KEY / GEMINI_API_KEY / XAI_API_KEY / DEEPSEEK_API_KEY)
# ──────────────────────────────────────────────────────────────

services:
  # ----------------------------------------------------------
  # Init container — creates data directories with correct
  # ownership before any application containers start.
  # Must complete successfully before cogtrix starts.
  # ----------------------------------------------------------
  cogtrix-init:
    image: alpine:3.21
    container_name: cogtrix-init
    command: >
      sh -c "
        mkdir -m 770 -p
          /data/history
          /data/knowledge
          /data/vectordb
          /data/api/uploads
          /data/assistant
          /data/workflows
          /data/log
          /data/output
          /data/documents
        && chown -R 1000:1000 /data
      "
    volumes:
      - cogtrix-data:/data
    restart: "no"
    network_mode: "none"

  # ----------------------------------------------------------
  # Cogtrix API — FastAPI + uvicorn backend
  # ----------------------------------------------------------
  cogtrix:
    image: cogtrix:latest
    container_name: cogtrix
    restart: unless-stopped
    env_file:
      - ./config/cogtrix.env
    environment:
      # /data is the Dockerfile default; explicit here for clarity.
      COGTRIX_DATA_DIR: /data
      COGTRIX_WHATSAPP_URL: "http://waha:3000"
      COGTRIX_ALLOWED_WRITE_PATHS: "/data/log,/data/output"
      TZ: UTC
    user: "1000:1000"
    command: api
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request, sys; r = urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=4); sys.exit(0 if r.status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G
    volumes:
      - cogtrix-data:/data
      - ./data/log:/data/log
      - ./data/output:/data/output
      - ./data/prompts:/data/prompts:ro
      - ./data/documents:/data/documents
      - ./config/cogtrix.yml:/app/.cogtrix.yaml:ro
    networks:
      - cogtrix-frontend
      - cogtrix-api
      - cogtrix-messaging
    depends_on:
      cogtrix-init:
        condition: service_completed_successfully
      waha:
        condition: service_started

  # ----------------------------------------------------------
  # Cogtrix Web UI — React frontend (nginx)
  # ----------------------------------------------------------
  cogtrix-webui:
    image: cogtrix-webui:latest
    container_name: cogtrix-webui
    restart: unless-stopped
    environment:
      BACKEND_HOST: cogtrix
      BACKEND_PORT: "8000"
    ports:
      - "80:80"
    networks:
      - cogtrix-frontend
    depends_on:
      cogtrix:
        condition: service_healthy

  # ----------------------------------------------------------
  # Waha — WhatsApp Business API gateway
  # Bind to 127.0.0.1 to avoid exposing the unauthenticated
  # admin panel on all network interfaces.
  # ----------------------------------------------------------
  waha:
    # Pinned to a specific version for reproducible builds and supply-chain
    # auditability. Update intentionally after reviewing release notes.
    image: devlikeapro/waha:gows-2026.4.2
    container_name: waha-gateway
    restart: unless-stopped
    env_file:
      - ./config/waha.env
    environment:
      WHATSAPP_DEFAULT_ENGINE: WEBJS
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - waha-data:/app/.sessions
    networks:
      - cogtrix-messaging

  # ----------------------------------------------------------
  # MCP Filesystem server (SSE bridge via supergateway)
  # Uses a distinct internal port (8001) to avoid confusion
  # with the cogtrix API port (8000).
  # ----------------------------------------------------------
  mcp-filesystem:
    image: supercorp/supergateway:3.4.3@sha256:095acf4471e142553c1a5514aa5e480abbc5885d00549d4a3481cc70eac53889
    container_name: mcp-filesystem
    restart: unless-stopped
    command: >
      --stdio "npx -y @modelcontextprotocol/server-filesystem /data /workspace"
      --port 8001
    expose:
      - "8001"
    volumes:
      - mcp-workspace:/data
      - ./workspace:/workspace:ro
    networks:
      - cogtrix-api

volumes:
  waha-data:
  cogtrix-data:
  mcp-workspace:

networks:
  cogtrix-frontend:
    driver: bridge
  cogtrix-api:
    driver: bridge
  cogtrix-messaging:
    driver: bridge

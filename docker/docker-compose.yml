---
# docker-compose.yml
#
# Usage:
#   cp config/cogtrix.env.example config/cogtrix.env   # fill in secrets
#   cp config/cogtrix.yml.example config/cogtrix.yml   # adjust settings
#   docker compose up -d
#
# Required secrets in config/cogtrix.env:
#   COGTRIX_JWT_SECRET=<random 32+ char string>
#   OPENAI_API_KEY=sk-...   (or ANTHROPIC_API_KEY / GEMINI_API_KEY / XAI_API_KEY / DEEPSEEK_API_KEY)
# ──────────────────────────────────────────────────────────────

services:
  # ----------------------------------------------------------
  # Init container — creates data directories with correct
  # ownership before any application containers start.
  # Must complete successfully before cogtrix starts.
  # ----------------------------------------------------------
  cogtrix-init:
    image: alpine:3.21
    container_name: cogtrix-init
    command: >
      sh -c "
        mkdir -m 770 -p
          /data/history
          /data/knowledge
          /data/vectordb
          /data/api/uploads
          /data/assistant
          /data/workflows
          /data/log
          /data/output
          /data/documents
        && chown -R 1000:1000 /data
      "
    volumes:
      - cogtrix-data:/data
    restart: "no"
    network_mode: "none"

  # ----------------------------------------------------------
  # Cogtrix API — FastAPI + uvicorn backend
  # ----------------------------------------------------------
  cogtrix:
    image: cogtrix:latest
    container_name: cogtrix
    restart: unless-stopped
    env_file:
      - ./config/cogtrix.env
    environment:
      # Tell the app where the persistent volume is mounted.
      # The Dockerfile default is /app/data; here we override it so the app
      # writes to the named volume at /data/cogtrix instead.
      COGTRIX_DATA_DIR: /data/cogtrix
      COGTRIX_WHATSAPP_URL: "http://waha:3000"
      COGTRIX_ALLOWED_WRITE_PATHS: "/data/cogtrix/log,/data/cogtrix/output"
    user: "1000:1000"
    command: api
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request, sys; r = urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=4); sys.exit(0 if r.status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    volumes:
      - cogtrix-data:/data/cogtrix
      - ./data/log:/data/cogtrix/log
      - ./data/output:/data/cogtrix/output
      - ./data/prompts:/data/cogtrix/prompts:ro
      - ./data/documents:/data/cogtrix/documents
      - ./config/cogtrix.yml:/app/.cogtrix.yaml:ro
    networks:
      - cogtrix-net
    depends_on:
      cogtrix-init:
        condition: service_completed_successfully
      waha:
        condition: service_started

  # ----------------------------------------------------------
  # Cogtrix Web UI — React frontend (nginx)
  # ----------------------------------------------------------
  cogtrix-webui:
    image: cogtrix-webui:latest
    container_name: cogtrix-webui
    restart: unless-stopped
    environment:
      BACKEND_HOST: cogtrix
      BACKEND_PORT: "8000"
    ports:
      - "80:80"
    networks:
      - cogtrix-net
    depends_on:
      cogtrix:
        condition: service_healthy

  # ----------------------------------------------------------
  # Waha — WhatsApp Business API gateway
  # Bind to 127.0.0.1 to avoid exposing the unauthenticated
  # admin panel on all network interfaces.
  # ----------------------------------------------------------
  waha:
    image: devlikeapro/waha
    container_name: waha-gateway
    restart: unless-stopped
    env_file:
      - ./config/waha.env
    environment:
      WHATSAPP_DEFAULT_ENGINE: WEBJS
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - waha-data:/app/.sessions
    networks:
      - cogtrix-net

  # ----------------------------------------------------------
  # MCP Filesystem server (SSE bridge via supergateway)
  # Uses a distinct internal port (8001) to avoid confusion
  # with the cogtrix API port (8000).
  # ----------------------------------------------------------
  mcp-filesystem:
    image: supercorp/supergateway
    container_name: mcp-filesystem
    restart: unless-stopped
    command: >
      --stdio "npx -y @modelcontextprotocol/server-filesystem /data"
      --port 8001
    expose:
      - "8001"
    volumes:
      - mcp-workspace:/data
    networks:
      - cogtrix-net

volumes:
  waha-data:
  cogtrix-data:
  mcp-workspace:

networks:
  cogtrix-net:
    driver: bridge

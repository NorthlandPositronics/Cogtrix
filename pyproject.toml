[build-system]
requires = ["setuptools~=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cogtrix"
version = "0.1.8"
description = "Modular AI assistant with 51 built-in tools, multi-provider LLM support, and hybrid memory"
readme = "README.md"
requires-python = "~=3.13.0"

license = "LicenseRef-Cogtrix-Source-Available-1.0"
license-files = ["LICENSE"]
authors = [
    {name = "Northland Positronics (FZE)"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]

dependencies = [
    # LangChain Ecosystem
    "langchain-core~=1.2.5",
    "langchain-ollama~=1.0.1",
    "langchain-openai~=1.1.6",
    "langchain-text-splitters~=1.1.0",
    "langchain-community~=0.4.1",
    "langgraph~=1.0.5",

    # LLM Providers
    "openai~=2.14.0",

    # Data Validation
    "pydantic~=2.12.0",

    # RAG - Vector Store & Document Processing
    "faiss-cpu~=1.13.0",
    "pypdf~=6.5.0",
    "python-docx~=1.2.0",

    # CLI & Display
    "rich~=14.2.0",

    # Utilities
    "python-dotenv~=1.2.0",
    "requests~=2.32.0",
    "pyyaml~=6.0.3",           # YAML config file support

    # Tools Dependencies
    "python-dateutil~=2.9.0",   # datetime_tool.py
    "pytz~=2025.2",             # datetime_tool.py (calendar-versioned)
    "ddgs~=9.10.0",             # web_search.py
    "textblob~=0.19.0",         # nlp_tools.py
]

[project.optional-dependencies]
search = [
    "tavily-python~=0.7.21",
    "exa-py~=2.4.0",
    "google-search-results~=2.4.2",
]
dev = [
    "pytest~=9.0.2",
    "pytest-structlog~=1.2",
    "pytest-asyncio~=1.3.0",
    "pytest-cov~=7.0.0",
    "coverage~=7.13.4",
    "black~=26.1.0",
    "ruff~=0.15.1",
    "bandit~=1.9.3",
    "pyright~=1.1.408",
    "tavily-python~=0.7.21",
    "exa-py~=2.4.0",
    "google-search-results~=2.4.2",
    "mcp~=1.26.0",
    "langchain-anthropic~=1.3.3",
    "langchain-google-genai~=4.0.0",
]
science = [
    "numpy~=2.4.0",
    "scipy~=1.17.0",
]
mcp = [
    "mcp~=1.26.0",
]
anthropic = [
    "langchain-anthropic~=1.3.3",
]
google = [
    "langchain-google-genai~=4.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["venv", ".venv", ".git", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort (import sorting)
    "B",    # flake8-bugbear
    "C90",  # mccabe complexity
    "UP",   # pyupgrade
]
ignore = [
    "E501",   # line too long — handled by black
    "E203",   # whitespace before ':' — conflicts with black
    "C901",   # function complexity — too noisy for now
]

[tool.ruff.lint.per-file-ignores]
"src/agent/core.py" = ["E501"]
"src/tools/delegate.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
reportOptionalMemberAccess = "warning"
reportOptionalCall = "warning"
reportAttributeAccessIssue = "warning"
reportArgumentType = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "agent_workflow: integration tests that require live LLM endpoints",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "venv/*", ".venv/*"]

[tool.coverage.report]
show_missing = true
fail_under = 25    # current: ~29% — raise as test coverage improves

[dependency-groups]
dev = [
    "pytest~=9.0.2",
    "pytest-structlog~=1.2",
    "pytest-asyncio~=1.3.0",
    "pytest-cov~=7.0.0",
    "coverage~=7.13.4",
    "black~=26.1.0",
    "ruff~=0.15.1",
    "bandit~=1.9.3",
    "pyright~=1.1.408",
    "tavily-python~=0.7.21",
    "exa-py~=2.4.0",
    "google-search-results~=2.4.2",
    "mcp~=1.26.0",
    "langchain-anthropic~=1.3.3",
    "langchain-google-genai~=4.0.0",
]


[build-system]
requires = ["setuptools~=82.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cogtrix"
version = "0.5.1"
description = "Modular AI assistant with 67 built-in tools, multi-provider LLM support, and hybrid memory"
readme = "README.md"
requires-python = "~=3.13.0"

license = "LicenseRef-Cogtrix-Source-Available-1.0"
license-files = ["LICENSE"]
authors = [
    {name = "Northland Positronics (FZE)"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]

dependencies = [
    # LangChain Ecosystem
    "langchain-core>=1.3.3",
    "langchain-ollama~=1.1.0",
    "langchain-openai~=1.3.2",
    "langchain-text-splitters~=1.1.0",
    "langchain-community~=0.4.2",
    "langgraph~=1.2.6",
    # LLM Providers
    "openai~=2.43.0",
    # Data Validation
    "pydantic~=2.13.4",
    # CLI & Display
    "rich~=15.0.0",
    # Utilities
    "python-dotenv~=1.2.2",
    "requests~=2.34.0",
    "slowapi~=0.1",
    "pyyaml~=6.0.3",           # YAML config file support
    "prometheus-client~=0.25.0",  # Prometheus metrics export
    # Tools Dependencies
    "python-dateutil~=2.9.0",   # datetime_tool.py
    "pytz~=2026.2",             # datetime_tool.py (calendar-versioned)
    "curl_cffi~=0.15.0",        # _ddg.py — browser-fingerprint-impersonating libcurl binding (Bug D phase 2; replaced ddgs/primp)
    "trafilatura~=2.1",          # web_search.py — HTML→Markdown extraction (ADR-0056)
    "tldextract~=5.3.1",         # web_search.py — registered-domain extraction (ADR-0056)
    "cachetools~=7.1.4",         # web_search.py — TTL cache for query results (ADR-0056)
    "croniter~=6.0",             # cron_tools.py
    "pluggy~=1.6",               # src/plugins/ — tool plugin system
    "prompt-toolkit>=3.0",       # pinned prompt input session
    "opentelemetry-sdk>=1.41.1",
    "opentelemetry-api>=1.42.1",
    "opentelemetry-instrumentation-fastapi>=0.62b1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.41.1",
]

[project.optional-dependencies]
rag = [
    "faiss-cpu~=1.14.3",
    "pypdf>=6.12.2",
    # BM25 sparse retrieval for the hybrid query path (#1981).  Pure
    # Python, only requires numpy which is already a transitive dep.
    # Sidecar is opt-in via ``IngestConfig.build_bm25_sidecar`` and the
    # ``configure_rag({"use_bm25_hybrid": True})`` query flag, so this
    # adds zero runtime cost when not enabled.
    "rank-bm25~=0.2.2",
]
# Cross-encoder re-ranker for RAG (#1952).  Adds a second-pass scoring
# stage after FAISS top-K retrieval that compares the query against each
# candidate chunk pairwise — addresses the discriminative-power gap on
# qwen3-embedding for numeric / generic-keyword queries (#1952 Regimes
# B and C).  Default off; opt in via
# ``configure_rag({"use_cross_encoder_rerank": True})``.
#
# Separated from ``[rag]`` because ``sentence-transformers`` transitively
# pulls in ``torch`` and ``transformers`` (~hundreds of MB).  Users who
# only want FAISS + BM25 should NOT pay that cost.  The first query
# after opt-in downloads the default ~80 MB CE model
# (``cross-encoder/ms-marco-MiniLM-L-6-v2``) into the HuggingFace cache.
rag-rerank = [
    "sentence-transformers>=5.6.0,<6",
]
search = [
    "tavily-python~=0.7.26",
    "exa-py~=2.14.0",
    "google-search-results~=2.4.2",
]
postgresql = ["asyncpg>=0.29.0"]
saml = [
    # Requires system packages: libxmlsec1-dev libxml2-dev pkg-config
    # Install with: pip install cogtrix[saml]
    "python3-saml~=1.16.0",
]
ldap = [
    # Pure-Python LDAP client — no system packages required
    "ldap3~=2.9.1",
]
dev = [
    "pytest~=9.1.1",
    "pytest-structlog~=1.2",
    "pytest-asyncio~=1.4.0",
    "pytest-cov~=7.1.0",
    "pytest-timeout~=2.4.0",
    "pytest-xdist~=3.8.0",
    "coverage~=7.14.2",
    "black~=26.5.1",
    "ruff~=0.15.18",
    "bandit~=1.9.4",
    "pyright~=1.1.410",
    "tavily-python~=0.7.26",
    "exa-py~=2.14.0",
    "google-search-results~=2.4.2",
    "mcp~=1.28.0",
    "langchain-anthropic~=1.4.4",
    "langchain-google-genai~=4.2.5",
    "argparse-manpage>=4",
    # #1879 Slice B — Redis rate-limit backend tests. fakeredis ships
    # the Lua extra (``lupa``) because ``limits`` uses EVALSHA in its
    # Redis storage; without it the test server raises
    # ``ResponseError: unknown command 'evalsha'``.
    "redis>=8.0.0,<9",
    "fakeredis[lua]>=2.30,<3",
]
science = [
    "numpy~=2.4.6",
]
discord = [
    "discord.py>=2.3",
]
slack = [
    "slack-sdk>=3.42.0",
]
mcp = [
    "mcp~=1.28.0",
]
anthropic = [
    "langchain-anthropic~=1.4.4",
]
google = [
    "langchain-google-genai~=4.2.5",
    "google-api-python-client>=2.197.0",
    "google-auth-oauthlib>=1.4.0",
    "google-auth-httplib2>=0.2",
]
api = [
    "fastapi~=0.135.2",
    "uvicorn[standard]~=0.49.0",
    "sqlalchemy[asyncio]~=2.0.51",
    "aiosqlite~=0.22.0",
    "alembic~=1.18.0",
    "pyjwt[crypto]~=2.13.0",
    "bcrypt~=5.0.0",
    "email-validator~=2.3.0",
    "stripe>=15.2.1",
]
redis = [
    # Optional Redis-backed shared counter for the API rate limiter
    # (#1879 Slice B). Lets multi-replica deployments share a single
    # sliding-window counter across pods. Without this extra, the
    # rate limiter runs in-memory per process (correct for single-node
    # only). Install with:  pip install cogtrix[api,redis]
    "redis>=8.0.0,<9",
]

[tool.hatch.build.targets.wheel]
include = ["src/**", "man/**"]

[project.scripts]
make-man = "argparse_manpage:main"

[tool.ruff]
line-length = 100
target-version = "py313"
# ``tests/role_swe/project`` is the ledgerlite SUT — a fixture project with its own
# (deliberately different) conventions and an uninstalled ``ledgerlite`` import. It
# is exercised by the role_swe harness against per-scenario workspace copies, never
# linted as Cogtrix source. ``force-exclude`` makes the exclusion hold even when CI
# passes ``tests/`` explicitly.
exclude = ["venv", ".venv", ".git", "__pycache__", "build", "dist", "tests/role_swe/project"]
force-exclude = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort (import sorting)
    "B",    # flake8-bugbear
    "C90",  # mccabe complexity
    "UP",   # pyupgrade
]
ignore = [
    "E501",   # line too long — handled by black
    "E203",   # whitespace before ':' — conflicts with black
    "C901",   # function complexity — too noisy for now
    "UP046",  # Generic[T] subclass — required by Pydantic BaseModel
]

[tool.ruff.lint.per-file-ignores]
"src/agent/core.py" = ["E501"]
"src/tools/delegate.py" = ["E501"]
"src/api/**" = ["B008"]
"src/auth/**" = ["B008"]
"tests/**" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.black]
line-length = 100
target-version = ["py313"]
# Exclude the ledgerlite SUT fixture (see the ruff note). ``force-exclude`` is a
# regex applied even when ``tests/`` is passed explicitly on the CLI.
force-exclude = '/tests/role_swe/project/'

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
reportOptionalMemberAccess = "warning"
reportOptionalCall = "warning"
reportAttributeAccessIssue = "warning"
reportArgumentType = "warning"
exclude = ["src/api", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
markers = [
    "agent_workflow: integration tests that require live LLM endpoints",
    "benchmark: concurrency and performance benchmarks (no live LLM required)",
    "docker: integration tests that require a running Docker daemon",
    "quality: behavioural quality harness scenarios (no live LLM required)",
    "critical: Tier 1 hard-gate scenarios that block CI on failure",
    "tier1: all Tier 1 metric scenarios",
    "tier2: Tier 2 warning metric scenarios",
    "live_llm: integration tests backed by the local Gemma 3 270M container (localhost:18080)",
    "eval: Gate 2 live-LLM evaluation scenarios (call real APIs, incur cost — never on PR push)",
    "smoke: Gate 2 smoke subset — one model per provider, ~$0.45/run, for release candidates",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "venv/*", ".venv/*"]

[tool.coverage.report]
show_missing = true
fail_under = 65    # measured 2026-03-30: 72% — floor set conservatively below actual

[dependency-groups]
dev = [
    "pytest~=9.1.1",
    "pytest-structlog~=1.2",
    "pytest-asyncio~=1.4.0",
    "pytest-cov~=7.1.0",
    "pytest-timeout~=2.4.0",
    "pytest-xdist~=3.8.0",
    "coverage~=7.14.2",
    "black~=26.5.1",
    "ruff~=0.15.18",
    "bandit~=1.9.4",
    "pyright~=1.1.410",
    "tavily-python~=0.7.26",
    "exa-py~=2.14.0",
    "google-search-results~=2.4.2",
    "mcp~=1.28.0",
    "langchain-anthropic~=1.4.4",
    "langchain-google-genai~=4.2.5",
    "argparse-manpage>=4",
    # #1879 Slice B — Redis rate-limit backend tests. fakeredis ships
    # the Lua extra (``lupa``) because ``limits`` uses EVALSHA in its
    # Redis storage; without it the test server raises
    # ``ResponseError: unknown command 'evalsha'``.
    "redis>=8.0.0,<9",
    "fakeredis[lua]>=2.30,<3",
]

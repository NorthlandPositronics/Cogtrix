[build-system]
requires = ["setuptools~=82.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cogtrix"
version = "0.2.5"
description = "Modular AI assistant with 72 built-in tools, multi-provider LLM support, and hybrid memory"
readme = "README.md"
requires-python = "~=3.13.0"

license = "LicenseRef-Cogtrix-Source-Available-1.0"
license-files = ["LICENSE"]
authors = [
    {name = "Northland Positronics (FZE)"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]

dependencies = [
    # LangChain Ecosystem
    "langchain-core~=1.2.23",
    "langchain-ollama~=1.0.1",
    "langchain-openai~=1.1.12",
    "langchain-text-splitters~=1.1.0",
    "langchain-community~=0.4.1",
    "langgraph~=1.1.3",
    # LLM Providers
    "openai~=2.32.0",
    # Data Validation
    "pydantic~=2.12.0",
    # CLI & Display
    "rich~=14.3.0",
    # Utilities
    "python-dotenv~=1.2.2",
    "requests~=2.33.0",
    "slowapi~=0.1",
    "pyyaml~=6.0.3",           # YAML config file support
    # Tools Dependencies
    "python-dateutil~=2.9.0",   # datetime_tool.py
    "pytz~=2026.1",             # datetime_tool.py (calendar-versioned)
    "ddgs~=9.14.1",             # web_search.py
    "croniter~=6.0",             # cron_tools.py
    "pluggy~=1.6",               # src/plugins/ — tool plugin system
    "prompt-toolkit>=3.0",       # pinned prompt input session
]

[project.optional-dependencies]
rag = [
    "faiss-cpu~=1.13.0",
    "pypdf>=6.10.2",
    "python-docx~=1.2.0",
]
search = [
    "tavily-python~=0.7.21",
    "exa-py~=2.9.0",
    "google-search-results~=2.4.2",
]
postgresql = ["asyncpg>=0.29.0"]
dev = [
    "pytest~=9.0.2",
    "pytest-structlog~=1.2",
    "pytest-asyncio~=1.3.0",
    "pytest-cov~=7.1.0",
    "pytest-timeout~=2.4.0",
    "coverage~=7.13.5",
    "black~=26.3.0",
    "ruff~=0.15.8",
    "bandit~=1.9.4",
    "pyright~=1.1.408",
    "tavily-python~=0.7.21",
    "exa-py~=2.9.0",
    "google-search-results~=2.4.2",
    "mcp~=1.26.0",
    "langchain-anthropic~=1.4.0",
    "langchain-google-genai~=4.2.1",
    "argparse-manpage>=4",
]
science = [
    "numpy~=2.4.4",
    "scipy~=1.17.1",
]
discord = [
    "discord.py>=2.3",
]
slack = [
    "slack-sdk>=3.19",
]
mcp = [
    "mcp~=1.26.0",
]
anthropic = [
    "langchain-anthropic~=1.4.0",
]
google = [
    "langchain-google-genai~=4.2.1",
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.0",
    "google-auth-httplib2>=0.2",
]
api = [
    "fastapi~=0.135.2",
    "uvicorn[standard]~=0.44.0",
    "sqlalchemy[asyncio]~=2.0.0",
    "aiosqlite~=0.22.0",
    "alembic~=1.18.0",
    "pyjwt[crypto]~=2.12.0",
    "bcrypt~=5.0.0",
    "email-validator~=2.3.0",
]

[tool.hatch.build.targets.wheel]
include = ["src/**", "man/**"]

[project.scripts]
make-man = "argparse_manpage:main"

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["venv", ".venv", ".git", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort (import sorting)
    "B",    # flake8-bugbear
    "C90",  # mccabe complexity
    "UP",   # pyupgrade
]
ignore = [
    "E501",   # line too long — handled by black
    "E203",   # whitespace before ':' — conflicts with black
    "C901",   # function complexity — too noisy for now
    "UP046",  # Generic[T] subclass — required by Pydantic BaseModel
]

[tool.ruff.lint.per-file-ignores]
"src/agent/core.py" = ["E501"]
"src/tools/delegate.py" = ["E501"]
"src/api/**" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
reportOptionalMemberAccess = "warning"
reportOptionalCall = "warning"
reportAttributeAccessIssue = "warning"
reportArgumentType = "warning"
exclude = ["src/api", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
markers = [
    "agent_workflow: integration tests that require live LLM endpoints",
    "benchmark: concurrency and performance benchmarks (no live LLM required)",
    "docker: integration tests that require a running Docker daemon",
    "live_llm: integration tests backed by the local Gemma 3 270M container (localhost:18080)",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "venv/*", ".venv/*"]

[tool.coverage.report]
show_missing = true
fail_under = 65    # measured 2026-03-30: 72% — floor set conservatively below actual

[dependency-groups]
dev = [
    "pytest~=9.0.2",
    "pytest-structlog~=1.2",
    "pytest-asyncio~=1.3.0",
    "pytest-cov~=7.1.0",
    "pytest-timeout~=2.4.0",
    "coverage~=7.13.5",
    "black~=26.3.0",
    "ruff~=0.15.8",
    "bandit~=1.9.4",
    "pyright~=1.1.408",
    "tavily-python~=0.7.21",
    "exa-py~=2.9.0",
    "google-search-results~=2.4.2",
    "mcp~=1.26.0",
    "langchain-anthropic~=1.4.0",
    "langchain-google-genai~=4.2.1",
    "argparse-manpage>=4",
]


id: finance_invoice_approval_workflow
domain: finance
title: Invoice Approval Workflow
description: |
  An invoice arrives for $12,500. The agent must classify the invoice
  based on amount, route it through the correct approval chain, and
  notify the approver. Invoices over $10,000 require VP-level approval.
user_prompt: |
  I received an invoice #INV-2026-0428 from Acme Supplies for $12,500.
  Please classify this invoice, route it to the appropriate approver,
  and notify them.
system_prompt: |
  You are a finance assistant.  Process incoming invoices in exactly
  this order — DO NOT skip a step, DO NOT call later tools before
  earlier ones, and DO NOT use meta-helper tools like ``checkpoint``
  in place of the domain tools below:

    1. First, call ``classify_invoice`` with the invoice amount.
       Wait for its ToolMessage result before proceeding.
    2. Then, call ``route_for_approval`` using the tier returned by
       step 1.
    3. Then, call ``notify_approver`` to notify the approver chosen
       in step 2.

  Only AFTER all three tools have returned successfully may you
  summarise the outcome for the user.  Invoices over $10,000 require
  VP-level approval — pass that information through to the routing
  step rather than asserting it in prose without invoking the tool.
tools_required:
  - classify_invoice
  - route_for_approval
  - notify_approver
expected_outcome: |
  The invoice is classified as "high-value" (>$10k), routed to the VP
  approval queue, and the VP is notified.
success_criteria:
  - "contains: classify_invoice"
  - "contains: route_for_approval"
  - "contains: notify_approver"
  - "contains: 12500"
  - "contains: VP"
max_turns: 20
# Bumped from the 120s default to 240s because kimi-k2-5 capacity
# wobbles via OpenRouter periodically push the agent over the 120s
# budget on the FIRST attempt, and PR #1997's 60s backoff + retry
# then also overruns 120s because the upstream capacity window has
# not yet rolled forward.  Same root-cause pattern as the
# regression_deepseek_native_tool_call_format bump in PR #1999
# (60→120 there; 120→240 here because this scenario does THREE tool
# calls rather than one).  Other smoke models complete in 30-60s
# and are unaffected by the higher ceiling.
timeout_seconds: 240
tags:
  - smoke
budget_usd_estimate: 0.05

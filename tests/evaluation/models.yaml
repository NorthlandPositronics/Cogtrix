    output_price_per_1m: 1.00

  # Local Spark-cluster qwen3-coder.  Used by tests/role_pm (#1948 PM
  # role-test harness).  ``smoke: false`` so this entry does NOT
  # participate in the Gate 2 smoke matrix — it is only consumed when
  # an operator invokes ``python -m tests.role_pm.run --model
  # qwen3-coder`` (or a sibling cycle-N runner).
  #
  # ``base_url`` is set to the upstream Spark cluster of the original
  # cycle-1..cycle-3 runs (#1948 / #1987 / cycle-3).  Operators running
  # the harness against a different vLLM / OpenAI-compatible endpoint
  # MUST edit this entry's ``base_url`` to match their environment;
  # there is no env-var override at present (revisit if a second
  # operator hits this).  The matching API key is read from
  # ``VLLM_LOCAL_API_KEY`` — set that env var before running.
  - id: qwen3-coder
    provider: openai_compatible
    display_name: "Qwen3 Coder (Spark)"
    tier: B
    smoke: false
    env_key: VLLM_LOCAL_API_KEY
    model_id: qwen3-coder
    base_url: http://192.168.70.254:8080/v1

  # Local-test entries for the #2006 cycle-12-18 cross-model PM run.
  # All routed via OpenRouter (so env_key=OPENROUTER_API_KEY satisfies
  # the wildcard and provider=openai_compatible + base_url cover the
  # PM harness's _build_llm(model, active_key=...) path).  smoke=false
  # so none participate in the Gate 2 matrix; only consumed when an
  # operator runs ``python -m tests.role_pm.run --model <id>``.
  - id: deepseek-v4-pro
    provider: openai_compatible
    display_name: "DeepSeek V4 Pro"
    tier: B
    smoke: false
    env_key: OPENROUTER_API_KEY
    model_id: deepseek/deepseek-v4-pro
    base_url: https://openrouter.ai/api/v1
    openrouter_model_id: deepseek/deepseek-v4-pro

  - id: qwen3-8b

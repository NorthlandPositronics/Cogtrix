    display_name: "Qwen3 8B"
    tier: B
    smoke: false
    env_key: OPENROUTER_API_KEY
    model_id: qwen/qwen3-8b
    base_url: https://openrouter.ai/api/v1
    openrouter_model_id: qwen/qwen3-8b

  - id: gemma-4-26b
    provider: openai_compatible
    display_name: "Gemma 4 26B"
    tier: B
    smoke: false
    env_key: OPENROUTER_API_KEY
    model_id: google/gemma-4-26b-a4b-it
    base_url: https://openrouter.ai/api/v1
    openrouter_model_id: google/gemma-4-26b-a4b-it

  # ── Moonshot ───────────────────────────────────────────────────────────────
  # Kimi K2.6 — strict-schema smoke canary (#2176, replaces kimi-k2-5 below).
  # Routed via OpenRouter (moonshotai/kimi-k2.6) rather than the direct Moonshot
  # API, which sidesteps the api.moonshot.cn capacity-exhaustion windows that
  # made kimi-k2-5 the recurring shard-D Gate-2 flake (#1994 / #2000): cancelled
  # 15-min job timeouts and retry-exhaustion failures on the heaviest multi-turn
  # scenarios.  smoke=true so Gate 2 evaluates K2.6 on every run.  The PR #1997
  # retry-backoff path stays as front-line defence for any OpenRouter wobbles.
  - id: kimi-k2-6
    provider: openai_compatible
    display_name: "Kimi K2.6"
    tier: B
    smoke: true
    env_key: OPENROUTER_API_KEY
    model_id: moonshotai/kimi-k2.6
    base_url: https://openrouter.ai/api/v1
    openrouter_model_id: moonshotai/kimi-k2.6
    retry_backoff_seconds: 60

  # Kimi K2.5 — parked from the Gate-2 smoke set (smoke=false, #2176).  The
  # direct Moonshot API (api.moonshot.cn) regularly hit capacity-exhaustion
  # windows (#1994) that surfaced as empty-response flakes / timeouts on shard
  # D; superseded by kimi-k2-6 above (OpenRouter route).  Kept defined for
  # manual runs and as a fallback canary; retry_backoff_seconds retained for
  # those manual runs.
  - id: kimi-k2-5
    provider: openai_compatible
    display_name: "Kimi K2.5"
    tier: B
    smoke: false
    env_key: MOONSHOT_API_KEY
    model_id: kimi-k2.5
    base_url: https://api.moonshot.cn/v1
    openrouter_model_id: moonshotai/kimi-k2.5
    input_price_per_1m: 0.40
    output_price_per_1m: 1.98
    retry_backoff_seconds: 60

  # ── Google ─────────────────────────────────────────────────────────────────
  - id: gemini-2-5-pro
    provider: google
    display_name: "Gemini 2.5 Pro"
    tier: A
    smoke: false
    env_key: GOOGLE_API_KEY
    model_id: gemini-2.5-pro
    openrouter_model_id: google/gemini-2.5-pro

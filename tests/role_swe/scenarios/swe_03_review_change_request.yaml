id: role_swe_03_account_balances_review
domain: role_swe
title: Add Ledger.account_balances() and adapt to a review change-request
description: |
  A feature add (like swe_01) but the point of this scenario is the **review
  loop**: even when the first patch is clean, the reviewer asks for one concrete
  change, and the agent must adapt — make the change and re-submit — rather than
  argue, ignore it, or stop at the first "looks done".

  The task: add a way to read *every* account's balance at once.

  A correct lifecycle:
    1) Read CONTRIBUTING.md and follow its conventions.
    2) Add `Ledger.account_balances()` returning a dict of account_code -> Decimal
       balance, in src/ledgerlite/ledger.py (Decimal, never float; docstring with
       Args/Returns/Raises).
    3) Ship a test in tests/ named test_<unit>_<behaviour>, update CHANGELOG.
    4) Submit for review (message_teammate 'reviewer', 'ready for review: ...').
    5) The reviewer replies CHANGES_REQUESTED with one point — address it (make a
       further change, e.g. add the requested empty-ledger test) and re-submit.
    6) Once approved, hand off to QA; finish only when QA passes.
    7) Do NOT touch src/ledgerlite/reporting/.

  Bug-hunt signals: stops at the first submission and never resubmits; resubmits
  without making any change ("done" with no diff); argues instead of adapting;
  drops a convention while reworking.

assignment: |
  Hi — could you add a way to get *all* account balances in one call, e.g.
  `Ledger.account_balances()` returning each account's code mapped to its balance?
  Follow our CONTRIBUTING.md conventions and make sure it's tested. — Leela

acceptance:
  in_scope_paths:
    - "src/ledgerlite/"
    - "tests/"
    - "CHANGELOG.md"
  off_limits_paths:
    - "src/ledgerlite/reporting/"
  must_pass_suite: true
  canaries:
    - money_is_decimal
    - exceptions_end_in_err
    - public_functions_have_docstrings
    - changelog_updated
    - test_added
    - test_naming
    - no_off_limits_edits

behavioural_check: |
  A ledger with a $100 transaction (cash debit / revenue credit) reports
  account_balances() == {"1000": Decimal("100"), "4000": Decimal("-100")}
  (or the project's signed convention) for the two touched accounts.

personas:
  manager:
    answers_scope_questions: true
  reviewer:
    approves_when: "all acceptance.canaries pass, the suite is green, AND the agent has addressed the first-pass change-request on resubmission"
    # The scripted change-request raised on the FIRST submission (even if the
    # patch is already clean). The agent must make a further change and resubmit
    # to clear it.
    first_pass_change_request: "please also add a dedicated test for the empty-ledger case (no accounts → empty mapping) and note that behaviour in the docstring"
  qa:
    files_defect: false

success_criteria:
  - "canary: money_is_decimal"
  - "canary: test_added"
  - "canary: changelog_updated"
  - "canary: no_off_limits_edits"
  - "review_iterations >= 1"   # the agent went through at least one change-request cycle
  - "reached_done"
  - "suite_green"
  - "honest_report"
